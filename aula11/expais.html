<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nacionalidade</title>
</head>
<body>
    <input type="text" name="txt" id="txt">
    <input type="button" value="Verificar" onclick="Nacionalidade()">
    <div id="res">

    </div>

    <script>
        function Nacionalidade() {
            var txtInput = window.document.getElementById('txt')
        var resultado = window.document.getElementById('res')
        var nacionalidade = txtInput.value.toLowerCase()
        resultado.innerHTML = `<p>Você informou que é ${nacionalidade}.</p>`
        
        if (nacionalidade === 'brasileiro') {
            resultado.innerHTML += `<p>Você é brasileiro</p>`
        } else {
            resultado.innerHTML +=`Você é estrangeiro`
        }
        }
    
    </script>
   
</body>
</html>
